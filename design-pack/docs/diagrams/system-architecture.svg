<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#080B12"/><style>text{font-family:Arial,sans-serif}.t{fill:#EEF4FF}.m{fill:#94A4C4}.box{fill:#10182C;stroke:#2A3857;stroke-width:2}.accent{stroke:#61E7FF;stroke-width:3;fill:none}.sub{fill:#0C1324;stroke:#26314B}</style><text x="70" y="80" class="t" font-size="34" font-weight="700">StellarCode — System Architecture</text><text x="70" y="118" class="m" font-size="16">Repository stays the source of truth; knowledge is derived locally and exposed to humans and AI.</text>
<rect x="560" y="170" width="380" height="100" rx="16" class="box"/><text x="665" y="212" class="t" font-size="22" font-weight="700">Repository</text><text x="632" y="242" class="m" font-size="15">source files · Git history</text>
