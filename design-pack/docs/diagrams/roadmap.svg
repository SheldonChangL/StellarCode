<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620"><rect width="1500" height="620" fill="#080B12"/><style>text{font-family:Arial,sans-serif}.t{fill:#EEF4FF}.m{fill:#94A4C4}.b{fill:#10182C;stroke:#2A3857;stroke-width:2}.mvp{fill:#10243A;stroke:#61E7FF;stroke-width:2}.post{fill:#18172F;stroke:#A77BFF;stroke-width:2}</style><text x="70" y="78" class="t" font-size="34" font-weight="700">StellarCode Roadmap</text><text x="70" y="116" class="m" font-size="16">M0–M3 are the MVP. M3 closes only after measurable AI navigation savings are demonstrated.</text><line x1="130" y1="315" x2="1370" y2="315" stroke="#304264" stroke-width="4"/><g><circle cx="160" cy="315" r="13" fill="#61E7FF"/><circle cx="390" cy="315" r="13" fill="#61E7FF"/><circle cx="620" cy="315" r="13" fill="#61E7FF"/><circle cx="850" cy="315" r="16" fill="#5FE2A0"/><circle cx="1080" cy="315" r="13" fill="#A77BFF"/><circle cx="1310" cy="315" r="13" fill="#A77BFF"/></g>
<g><rect x="75" y="165" width="170" height="110" rx="14" class="mvp"/><text x="130" y="202" class="t" font-size="22" font-weight="700">M0</text><text x="103" y="232" class="m" font-size="14">Foundation</text><text x="103" y="253" class="m" font-size="12">cross-platform</text><rect x="305" y="355" width="170" height="110" rx="14" class="mvp"/><text x="360" y="392" class="t" font-size="22" font-weight="700">M1</text><text x="337" y="422" class="m" font-size="14">Index Engine</text><text x="330" y="443" class="m" font-size="12">deterministic graph</text><rect x="535" y="165" width="170" height="110" rx="14" class="mvp"/><text x="590" y="202" class="t" font-size="22" font-weight="700">M2</text><text x="569" y="232" class="m" font-size="14">Universe UI</text><text x="566" y="253" class="m" font-size="12">human explorer</text><rect x="755" y="355" width="190" height="120" rx="14" fill="#102B2A" stroke="#5FE2A0" stroke-width="2"/><text x="818" y="393" class="t" font-size="22" font-weight="700">M3</text><text x="795" y="423" class="m" font-size="14">AI Gateway</text><text x="787" y="445" fill="#5FE2A0" font-size="12">MVP VALIDATION GATE</text><rect x="995" y="165" width="170" height="110" rx="14" class="post"/><text x="1050" y="202" class="t" font-size="22" font-weight="700">M4</text><text x="1032" y="232" class="m" font-size="14">Daemon &amp; Scale</text><text x="1026" y="253" class="m" font-size="12">daily reliability</text><rect x="1225" y="355" width="170" height="110" rx="14" class="post"/><text x="1280" y="392" class="t" font-size="22" font-weight="700">M5</text><text x="1250" y="422" class="m" font-size="14">Intelligence</text><text x="1249" y="443" class="m" font-size="12">memory · timeline</text></g><rect x="75" y="520" width="870" height="50" rx="12" fill="#0D1B2A" stroke="#61E7FF"/><text x="357" y="551" fill="#61E7FF" font-size="16" font-weight="700">MVP = M0 + M1 + M2 + M3</text><rect x="995" y="520" width="400" height="50" rx="12" fill="#161429" stroke="#A77BFF"/><text x="1090" y="551" fill="#A77BFF" font-size="16" font-weight="700">Post-MVP = M4 + M5</text></svg>
