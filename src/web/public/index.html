<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>StellarCode Universe</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="StellarCode"><span class="brand-mark">✦</span><span>StellarCode</span><span class="version">0.5</span></div>
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="Universe location"></nav>
      <button id="searchTrigger" class="search-trigger" type="button"><span class="search-icon">⌕</span><span>Search files, symbols, tasks…</span><kbd>⌘K</kbd></button>
      <div class="top-actions"><a class="project-home" href="/" title="All projects">Projects</a><span id="syncState" class="sync-state"><i></i> indexed</span><button id="resetView" class="icon-button" title="Back to galaxies">◎</button></div>
    </header>

    <aside class="rail" aria-label="Primary navigation">
      <button class="rail-button active" data-view="universe" title="Universe"><span>◉</span><small>Map</small></button>
      <button class="rail-button" data-view="changes" title="Changes"><span>◷</span><small>Changes</small></button>
      <div class="rail-spacer"></div>
      <button class="rail-button" id="architectureBtn" title="Architecture overview"><span>⌘</span><small>Arch</small></button>
    </aside>

    <main class="main">
      <section id="universeView" class="view active">
        <canvas id="universe" aria-label="Interactive code universe"></canvas>
        <div id="universeHud" class="universe-hud"></div>
        <div id="roleLegend" class="role-legend"></div>
        <div id="tooltip" class="node-tooltip hidden"></div>
        <div class="canvas-controls">
          <button id="zoomOut" title="Zoom out">−</button><button id="zoomIn" title="Zoom in">＋</button><button id="fitView" title="Fit view">⌾</button>
        </div>
        <div id="universeHint" class="universe-hint">Click a galaxy to enter · scroll to zoom · drag to explore</div>
      </section>

      <section id="changesView" class="view changes-view">
        <div class="section-kicker">Repository memory</div>
        <h1>Recent changes</h1>
        <p class="section-copy">Incremental index activity recorded by StellarCode.</p>
        <div id="changesList" class="changes-list"></div>
      </section>
    </main>

    <aside id="inspector" class="inspector hidden" aria-live="polite"></aside>
  </div>

  <div id="palette" class="palette-backdrop hidden">
    <div class="palette" role="dialog" aria-modal="true" aria-label="Search StellarCode">
      <div class="palette-input-wrap"><span>⌕</span><input id="searchInput" autocomplete="off" placeholder="Search file, symbol, or intent…" /><kbd>ESC</kbd></div>
      <div id="searchResults" class="search-results"></div>
      <div class="palette-footer"><span>↵ open</span><span>StellarCode searches the index before source files</span></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
